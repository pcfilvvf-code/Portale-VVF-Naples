{% extends "base.html" %}
{% block title %}Registrati - Portale VVF{% endblock %}
{% block body_class %}page-login{% endblock %}

{% block content %}
<div class="login-card">
  <div class="header">
    <div class="logo-box">
      <div style="position: relative; display: flex; justify-content: center; align-items: center;">
        <i class="fa-solid fa-phone" style="transform: rotate(-15deg); font-size: 32px;"></i>
        <i class="fa-solid fa-fire" style="position: absolute; top: -8px; right: -12px; color: #dc2626; font-size: 20px;"></i>
      </div>
    </div>
    <h1 class="title">Registrazione</h1>
  </div>

  {% if error %}
  <div class="alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/register" style="width: 100%;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <div class="form-group">
      <div class="icon-box"><i class="fa-solid fa-user"></i></div>
      <input type="text" name="username" class="input-field" placeholder="Username Roblox" required>
    </div>

    <div class="form-group">
      <div class="icon-box"><i class="fa-solid fa-key"></i></div>
      <input type="password" name="password" class="input-field" placeholder="Scegli una Password" required minlength="6">
    </div>

    <div class="form-group">
      <div class="icon-box"><i class="fa-solid fa-shield-halved"></i></div>
      <input type="password" name="access_code" class="input-field" placeholder="Codice di Accesso Comune" required>
    </div>

    <button type="submit" class="btn-login">Registrati</button>
  </form>

  <div style="margin-top: 15px; font-size: 13px; color: #ffffff; text-align: center;">
    Hai già un account? <a href="/login" style="color: #efb837; text-decoration: none; font-weight: bold;">Accedi qui</a>
  </div>
</div>
{% endblock %}
